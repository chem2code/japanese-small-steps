<!DOCTYPE html>
{% include base.html %}
<html lang="zh-CN" itemscope itemtype="http://schema.org/BlogPosting">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#post">跳到课程内容</a>
    <div id="wrapper" class="app-shell">
      <div class="overlay" aria-hidden="true"></div>
      {% include sidebar.html %}
      <div id="page-content-wrapper" class="app-main">
        <header class="mobile-header">
          <a class="mobile-brand" href="{{ basepath }}/">日语<span>小步</span></a>
          <button type="button" class="hamburger is-closed" data-toggle="offcanvas" aria-label="打开导航">
            <span class="hamb-top"></span><span class="hamb-middle"></span><span class="hamb-bottom"></span>
          </button>
        </header>
        <main class="content-wrap course-wrap">
          <article role="article" id="post" class="post-content course-content" itemprop="articleBody">
            {{ content }}
          </article>
        </main>
        {% include footer.html %}
      </div>
    </div>
  </body>
</html>
